name: Tests

on:
  push:
    branches: [v2.x]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, fileinfo, gd
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Show installed versions
        run: composer show | grep -E "^(laravel/framework|orchestra/testbench|phpunit/phpunit|guzzlehttp/[a-z-]+|folklore/[a-z-]+) "

      - name: Run tests
        run: vendor/bin/phpunit

  core:
    name: PHP ${{ matrix.php }} - Laravel 13 - core only

    # The core requires only illuminate/* (docs/decisions/0002). This job removes
    # the packages the modules need, and runs the tests of the core.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, fileinfo
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-core-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-core-

      - name: Install dependencies
        run: |
          composer remove --dev folklore/laravel-mediatheque folklore/laravel-image folklore/laravel-locale folklore/laravel-panneau cviebrock/eloquent-sluggable google/apiclient guzzlehttp/guzzle laravel/fortify parsecsv/php-parsecsv --no-interaction --no-update
          composer require --dev "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Show installed versions
        run: |
          composer show | grep -E "^(laravel/framework|orchestra/testbench|phpunit/phpunit|guzzlehttp/[a-z-]+|folklore/[a-z-]+) " || true
          if composer show | grep -qE "^(folklore/laravel-(mediatheque|image|locale|panneau)|laravel/fortify|google/apiclient) "; then
            echo "A package of the modules is installed." >&2
            exit 1
          fi

      - name: Run the tests of the core
        run: vendor/bin/phpunit --group core

  guzzle:
    name: PHP 8.4 - Laravel 13 - Guzzle ${{ matrix.guzzle }}

    # composer.json accepts Guzzle 7 and 8. The other jobs install the latest
    # release allowed by each Laravel version: Guzzle 7 on Laravel 12, Guzzle 8
    # on Laravel 13. This job checks the lowest patched release of each line
    # (GHSA-v5mv-p594-2x33).
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        guzzle: ['7.15.2', '8.0.1']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, fileinfo, gd
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-laravel13.*-guzzle${{ matrix.guzzle }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php8.4-laravel13.*-guzzle${{ matrix.guzzle }}-

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:13.*" "guzzlehttp/guzzle:${{ matrix.guzzle }}" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Show installed versions
        run: composer show | grep -E "^(laravel/framework|orchestra/testbench|phpunit/phpunit|guzzlehttp/[a-z-]+|folklore/[a-z-]+) "

      - name: Run tests
        run: vendor/bin/phpunit

  mysql:
    name: PHP 8.4 - Laravel ${{ matrix.laravel }} - MySQL 8.4
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, fileinfo, gd
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php8.4-laravel${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Show installed versions
        run: composer show | grep -E "^(laravel/framework|orchestra/testbench|phpunit/phpunit|guzzlehttp/[a-z-]+|folklore/[a-z-]+) "

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password

  pgsql:
    name: PHP 8.4 - Laravel ${{ matrix.laravel }} - PostgreSQL 17

    # The JSON fixtures' columns are jsonb, as in a PostgreSQL site: it reorders
    # keys and reformats the stored value.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_pgsql, fileinfo, gd
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php8.4-laravel${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Show installed versions
        run: composer show | grep -E "^(laravel/framework|orchestra/testbench|phpunit/phpunit|guzzlehttp/[a-z-]+|folklore/[a-z-]+) "

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          DB_DRIVER: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: password

  conformance:
    name: PHP 8.4 - Laravel 13 - Panneau protocol conformance

    # The panneau module's adapter, through the conformance kit of the Panneau protocol:
    # testbench.yaml serves a Panneau resource on a Folklore repository.
    runs-on: ubuntu-latest

    env:
      # The @panneau/protocol release that goes with the laravel-panneau of require-dev
      # (@panneau/protocol@5.0.0-alpha.6, for laravel-panneau 5.0.0-alpha.5)
      PANNEAU_PROTOCOL_REF: 890075747b245f95bc97c26e43406779ac7a71ea

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, fileinfo, gd
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-conformance-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php8.4-conformance-

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Show installed versions
        run: composer show | grep -E "^(laravel/framework|orchestra/testbench|folklore/[a-z-]+) "

      - name: Check out @panneau/protocol
        uses: actions/checkout@v5
        with:
          repository: folkloreinc/panneau-js
          ref: ${{ env.PANNEAU_PROTOCOL_REF }}
          path: build/panneau-js
          sparse-checkout: packages/protocol

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Bundle the conformance kit
        run: tests/conformance/build.sh build/panneau-js build/conformance.mjs

      - name: Build and serve the fixture app
        run: |
          vendor/bin/testbench workbench:build
          vendor/bin/testbench serve --port=8000 > build/serve.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --output /dev/null http://127.0.0.1:8000/panneau/api/definition && exit 0
            sleep 1
          done
          echo "The app did not start." && exit 1

      - name: Run the conformance kit
        run: node tests/conformance/run.mjs build/conformance.mjs http://127.0.0.1:8000/panneau/api

      - name: Show the server log
        if: failure()
        run: cat build/serve.log
